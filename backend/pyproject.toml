[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = [".venv", "var", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
